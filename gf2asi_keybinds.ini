// Keyboard shortcuts. Values are Windows virtual-key codes (hex or decimal); a
// full list is here: https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
// The menu action shortcuts can also be rebound in-game from the Keybinds tab,
// which rewrites this file. Everything else lives in gf2asi_settings.ini.
[Keybinds]
// Menu action shortcuts
menu.toggle=0x70
menu.interactive=0x71
player.godmode=0x74
player.fly=0x75
world.freeze=0x76
camera.photomode=0x77
// Held movement keys while in fly mode (PageUp / PageDown)
flyup=0x21
flydown=0x22
