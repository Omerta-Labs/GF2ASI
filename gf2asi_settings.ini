[Fixes]
// EXPERIMENTAL, off by default: makes the brightness option work in windowed
// mode and stops the game clobbering desktop calibration in fullscreen
ApplyBrightnessFix=1

// Stops the VSync option locking the game to 30 FPS. Stock, fullscreen presents
// on every second vblank and windowed busy-waits 33.3 ms per frame, so VSync is
// always half of 60 Hz no matter which resolution and refresh rate are picked.
ApplyVSyncFix=1

// The curve the game feeds to the gamma ramp (the exponent it raises the ramp
// to). Range is 0.8 to 1.2, where 0.8 is what the PC build uses and 1.0 is the
// default on the console versions. Higher = darker and punchier, lower =
// brighter and flatter. The in-game video calibration screen does not work, so
// this is the only way to change it.
GammaContrast=1.0

// Forces the game's EdgeAA post-process (depth-based edge smoothing) on every
// frame. The game normally only runs it when level data requests it, which is
// why edges look jagged; this keeps it active with the tuning below.
// EXPERIMENTAL, off by default while it is still being tested.
[EdgeAA]
Enable=0
// Edge blur strength; the stock effect was authored around 1.0
BlurWidth=1.0
// Texel distance between edge-detect samples
SampleLength=1.0
// Edge detect threshold, engine default 0.8. Lower = more edges smoothed
Barrier=0.8
// Depth difference weight, engine default ~7e-6. Higher = subtler depth steps count as edges
DepthWeight=7e-06
// Edge cutoff, only used in deferred mode
Cutoff=0.0
// Experimental: normal-buffer edge detect shader variant
DeferredMode=0

// The player portrait shown in the family tree, pause map and apparel screens.
// The game renders the head at full display resolution and then squeezes it
// into a 128x128 texture, which is why it looks like a block of pixels; this
// enlarges that capture target. Cost is Resolution * Resolution * 4 bytes,
// so 1 MB at 512 and 4 MB at 1024.
[MugShot]
Enable=1
// Square size of the capture, 128 (stock) to 4096. Past about 1024 the extra
// size mostly sharpens aliasing rather than revealing more detail.
Resolution=512
